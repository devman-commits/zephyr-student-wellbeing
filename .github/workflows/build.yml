name: Build Android APK & iOS Artifacts

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-student-wellbeing-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Runner Artifacts
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate and Package iOS Runner Artifacts
        run: |
          echo "Packaging iOS configuration, plist manifests, and assets..."
          mkdir -p build/ios_release
          if [ -d "ios" ]; then
            cp -r ios build/ios_release/
          fi
          cd build/ios_release
          zip -r Zephyr_iOS_Runner.zip .
          echo "iOS artifacts successfully packaged."

      - name: Upload iOS Runner Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-student-wellbeing-ios-runner
          path: build/ios_release/Zephyr_iOS_Runner.zip
          if-no-files-found: error
